site_name: CDM Entity Extraction Pipeline
site_description: Comprehensive Microbiome Common Data Model Entity Extraction with AI
site_author: CDM Pipeline Team
site_url: https://cdm-pipeline.readthedocs.io

# Repository
repo_name: cdm-pipeline
repo_url: https://github.com/your-org/cdm-pipeline
edit_uri: ""

# Navigation
nav:
  - Home: index.md
  - Getting Started:
      - Introduction: getting-started/introduction.md
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quickstart.md
      - Configuration: getting-started/configuration.md
  - User Guide:
      - CLI Usage: user-guide/cli.md
      - Entity Types: user-guide/entity-types.md
      - Pipeline Features: user-guide/features.md
      - Output Format: user-guide/output.md
      - Performance Tuning: user-guide/performance.md
  - Advanced Features:
      - BioMistral Validation: advanced/biomistral.md
      - OMOP CDM Mapping: advanced/omop.md
      - UMLS Integration: advanced/umls.md
      - Semantic Deduplication: advanced/semantic-deduplication.md
      - Custom Entity Types: advanced/custom-entities.md
  - API Reference:
      - REST API: api/rest-api.md
      - Python API: api/python-api.md
      - Pipeline Classes: api/pipeline-classes.md
      - Configuration Classes: api/config-classes.md
  - Architecture:
      - Overview: architecture/overview.md
      - Core Pipeline: architecture/core.md
      - Extractors: architecture/extractors.md
      - Mappers: architecture/mappers.md
      - Biomedical Module: architecture/biomedical.md
      - Design Patterns: architecture/patterns.md
  - Deployment:
      - Docker: deployment/docker.md
      - FastAPI Server: deployment/fastapi.md
      - Kubernetes: deployment/kubernetes.md
      - Cloud Deployment: deployment/cloud.md
      - Monitoring: deployment/monitoring.md
  - Development:
      - Contributing: development/contributing.md
      - Testing: development/testing.md
      - Code Style: development/code-style.md
      - Release Process: development/releases.md
  - Examples:
      - Basic Extraction: examples/basic.md
      - Batch Processing: examples/batch.md
      - Custom Pipeline: examples/custom.md
      - Integration Examples: examples/integration.md
  - Reference:
      - Configuration Reference: reference/config.md
      - CLI Reference: reference/cli.md
      - Entity Type Schema: reference/schema.md
      - Troubleshooting: reference/troubleshooting.md
      - FAQ: reference/faq.md
  - Changelog: changelog.md

# Theme
theme:
  name: material
  language: en
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: lime
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: lime
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.share
    - search.suggest
    - header.autohide
    - content.code.annotate
    - content.code.copy
    - content.tabs.link

# Plugins
plugins:
  - search:
      lang: en
  - minify:
      minify_html: true
  - git-revision-date-localized:
      type: datetime
      timezone: UTC
      locale: en
  - awesome-pages

# Customization
extra:
  analytics:
    provider: google
    property: G-XXXXXXXXXX
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/your-org/cdm-pipeline
    - icon: fontawesome/brands/docker
      link: https://hub.docker.com/r/yourorg/cdm-pipeline
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/cdm-pipeline/
  version:
    provider: mike

extra_css:
  - assets/extra.css
  - https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css

extra_javascript:
  - assets/extra.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

# Markdown Extensions
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      title: Table of contents
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      emoji_index: !!python/name:material.extensions.emoji.twemoji
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: your-org
      repo: cdm-pipeline
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      auto_append:
        - includes/mkdocs.md
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# Page tree
exclude_docs: |
  includes/

