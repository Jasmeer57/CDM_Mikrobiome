site_name: Microbiome Term Extraction Pipeline
site_description: Comprehensive documentation for the Microbiome Term Extraction Pipeline
site_author: Microbiome Pipeline Team
site_url: https://microbiome-pipeline.example.com

# Repository
repo_name: microbiome-pipeline
repo_url: https://github.com/your-org/microbiome-pipeline
edit_uri: edit/main/docs/

# Theme
theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: green
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: green
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.share
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github
    logo: material/microscope

# Plugins
plugins:
  - search:
      separator: '[\s\-\.]+'
      lang: en
  - minify:
      minify_html: true
  - git-revision-date-localized:
      type: datetime
      timezone: UTC
  - glightbox
  - mkdocs-jupyter:
      include_source: True
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            merge_init_into_class: true

# Markdown extensions
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      title: Table of contents
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:materialx.emoji.twemoji
      emoji_generator: !!python/name:materialx.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: your-org
      repo: microbiome-pipeline
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# Navigation
nav:
  - Home:
    - index.md
    - Features: features.md
    - Quick Start: quickstart.md
    - Installation: installation.md
  - User Guide:
    - user-guide/index.md
    - Configuration:
      - user-guide/configuration/index.md
      - Basic Configuration: user-guide/configuration/basic.md
      - Advanced Configuration: user-guide/configuration/advanced.md
      - Environment Variables: user-guide/configuration/environment.md
    - Running the Pipeline:
      - user-guide/running/index.md
      - CLI Usage: user-guide/running/cli.md
      - API Usage: user-guide/running/api.md
      - Docker Usage: user-guide/running/docker.md
    - Modules:
      - user-guide/modules/index.md
      - Terms Extraction: user-guide/modules/terms-extraction.md
      - Deduplication: user-guide/modules/deduplication.md
      - UMLS Mapping: user-guide/modules/umls.md
      - AI Cleaning: user-guide/modules/ai-cleaning.md
      - OMOP Processing: user-guide/modules/omop.md
    - Output and Results:
      - user-guide/output/index.md
      - Result Formats: user-guide/output/formats.md
      - Interpreting Results: user-guide/output/interpretation.md
      - Export Options: user-guide/output/export.md
  - Developer Guide:
    - developer-guide/index.md
    - Architecture:
      - developer-guide/architecture/index.md
      - Overview: developer-guide/architecture/overview.md
      - Module Structure: developer-guide/architecture/modules.md
      - Data Flow: developer-guide/architecture/dataflow.md
    - API Reference:
      - developer-guide/api/index.md
      - Core Classes: developer-guide/api/core.md
      - Configuration: developer-guide/api/config.md
      - Utilities: developer-guide/api/utils.md
    - Contributing:
      - developer-guide/contributing/index.md
      - Development Setup: developer-guide/contributing/setup.md
      - Code Style: developer-guide/contributing/style.md
      - Testing: developer-guide/contributing/testing.md
      - Pull Requests: developer-guide/contributing/pull-requests.md
    - Extending:
      - developer-guide/extending/index.md
      - Custom Modules: developer-guide/extending/modules.md
      - Custom Scoring: developer-guide/extending/scoring.md
      - Integration: developer-guide/extending/integration.md
  - Deployment:
    - deployment/index.md
    - Docker Deployment: deployment/docker.md
    - Kubernetes Deployment: deployment/kubernetes.md
    - Cloud Deployment: deployment/cloud.md
    - Monitoring: deployment/monitoring.md
    - Security: deployment/security.md
  - Tutorials:
    - tutorials/index.md
    - Basic Pipeline: tutorials/basic-pipeline.md
    - Custom Configuration: tutorials/custom-config.md
    - Batch Processing: tutorials/batch-processing.md
    - API Integration: tutorials/api-integration.md
    - Performance Tuning: tutorials/performance.md
  - Reference:
    - reference/index.md
    - CLI Commands: reference/cli.md
    - Configuration Options: reference/config.md
    - Model Details: reference/models.md
    - Troubleshooting: reference/troubleshooting.md
    - Changelog: changelog.md
    - License: license.md

# Extra CSS and JS
extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

# Extra
extra:
  analytics:
    provider: google
    property: G-XXXXXXXXXX
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/your-org/microbiome-pipeline
    - icon: fontawesome/brands/docker
      link: https://hub.docker.com/r/your-org/microbiome-pipeline
    - icon: fontawesome/solid/paper-plane
      link: mailto:contact@example.com
  version:
    provider: mike
    default: stable
    alias: true

