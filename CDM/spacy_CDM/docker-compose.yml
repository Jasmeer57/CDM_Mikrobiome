# Docker Compose configuration for Microbiome Term Extraction Pipeline
# Production-ready with multiple deployment options

version: '3.8'

services:
  # Main API service
  microbiome-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: microbiome-api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config
    environment:
      - PYTHONPATH=/app
      - LOG_LEVEL=INFO
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - WORKERS=4
      - MAX_REQUESTS=1000
      - MAX_REQUESTS_JITTER=50
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - microbiome-network
    depends_on:
      - redis
      - postgres

  # Redis for caching and job management
  redis:
    image: redis:7-alpine
    container_name: microbiome-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    networks:
      - microbiome-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL for persistent storage
  postgres:
    image: postgres:15-alpine
    container_name: microbiome-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=microbiome_pipeline
      - POSTGRES_USER=pipeline_user
      - POSTGRES_PASSWORD=pipeline_password
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    restart: unless-stopped
    networks:
      - microbiome-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipeline_user -d microbiome_pipeline"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: microbiome-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    restart: unless-stopped
    depends_on:
      - microbiome-api
    networks:
      - microbiome-network

  # Monitoring with Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: microbiome-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - microbiome-network

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: microbiome-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=REDACTED_PASSWORD
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    restart: unless-stopped
    networks:
      - microbiome-network

  # Jupyter notebook for development and testing
  jupyter:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: microbiome-jupyter
    ports:
      - "8888:8888"
    volumes:
      - ./:/app
      - jupyter_data:/home/pipeline/.jupyter
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - JUPYTER_TOKEN=microbiome123
    command: ["jupyter", "lab", "--ip=0.0.0.0", "--port=8888", "--no-browser", "--allow-root", "--NotebookApp.token='microbiome123'"]
    restart: unless-stopped
    networks:
      - microbiome-network

  # Worker for background processing
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: microbiome-worker
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config
    environment:
      - PYTHONPATH=/app
      - LOG_LEVEL=INFO
      - REDIS_URL=redis://redis:6379/0
      - POSTGRES_URL=postgresql://pipeline_user:pipeline_password@postgres:5432/microbiome_pipeline
    command: ["python", "worker.py"]
    restart: unless-stopped
    depends_on:
      - redis
      - postgres
    networks:
      - microbiome-network

# Networks
networks:
  microbiome-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# Volumes
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  jupyter_data:
    driver: local

# Development override
x-dev-overrides: &dev-overrides
  environment:
    - DEBUG=true
    - LOG_LEVEL=DEBUG
    - RELOAD=true
  volumes:
    - ./:/app
    - /app/data
  command: ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

# Production override
x-prod-overrides: &prod-overrides
  deploy:
    resources:
      limits:
        cpus: '2'
        memory: 4G
      reservations:
        cpus: '1'
        memory: 2G
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"