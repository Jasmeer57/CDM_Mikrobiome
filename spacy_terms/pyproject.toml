[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "microbiome-cdm-terms"
version = "0.1.0"
description = "Scientific Term Extraction Pipeline for Microbiome CDM"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "User", email = "user@example.com"}
]
dependencies = [
    "spacy==3.7.5",
    "scispacy==0.5.0",
    "thinc==8.2.5",
    "numpy<2.0.0",
    "blis>=1.3.0,<1.4.0",
    "sentence-transformers>=2.2.0",
    "torch>=1.13.0",
    "transformers>=4.20.0",
    "pandas>=1.3.0",
    "rapidfuzz>=2.0.0",
    "faiss-cpu>=1.7.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "python-multipart>=0.0.6",
    "requests>=2.28.0",
    "httpx>=0.24.0",
    "aiofiles>=22.1.0",
    "pydantic>=2.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "celery>=5.2.0",
    "redis>=4.3.0",
    "sqlalchemy>=2.0.0",
    "click>=8.0.0",
    "tqdm>=4.64.0",
    "pyyaml>=6.0",
    "structlog>=22.0.0",
    "prometheus-client>=0.15.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.20.0",
    "black>=22.0.0",
    "isort>=5.10.0"
]
ai = [
    "openai>=1.0.0",
    "anthropic>=0.3.0"
]

[tool.setuptools]
packages = ["spacy_terms"]
