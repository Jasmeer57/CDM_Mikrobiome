site_name: SpaCy Terms CDM Pipeline
site_description: Production-ready pipeline for CDM terminology extraction with multi-layer filtering and NLP
repo_url: https://github.com/SCAI-BIO/Microbiome-CDM

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - search.highlight
    - content.code.annotate
    - content.tabs.link
  palette:
    - scheme: default
      primary: teal
      accent: blue
    - scheme: slate
      primary: teal
      accent: blue

plugins:
  - search
  - mkdocstrings

nav:
  - Home: index.md
  - Getting Started:
    - getting-started/installation.md
  - Technical:
    - technical/deduplication.md
  - API Documentation:
    - Configuration API: api/configuration-api.md
    - Extraction Endpoints: api/extraction-endpoints.md
    - Health Endpoints: api/health-endpoints.md
  - Safety:
    - Medical Safety: safety/medical-safety.md

markdown_extensions:
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.tabbed
  - pymdownx.details
  - tables
  - toc
  - admonition
  - attr_list
  - def_list
  - footnotes
  - meta

extra:
  version: 2.0.0

copyright: Copyright &copy; 2025 - Jasmeer Singh Kalra
