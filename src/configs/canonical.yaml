# ── HuggingFace models (GLiNER + PubMedBERT + BioLORD) ──────────────────────
# Loaded via from_pretrained(); pinned by HF revision hash (git commit SHA
# on the HF hub repo at the time of the v2.1.1 build).
huggingface_models:
  - registry_key: gliner
    model_id: "urchade/gliner_medium"
    hf_revision: "b63645e3596b70a7d66e0597b3e739ad17bffe9d"
    class: GLiNERModel
    output_file: gliner_ner.csv
    threshold: 0.5
    chunk_size: 2000
    entity_types: "*"    # uses all 14 CDM_TYPES
    note: "General-purpose GLiNER zero-shot NER"
  - registry_key: gliner_biomed
    model_id: "Ihor/gliner-biomed-large-v1.0"
    hf_revision: "f79771210ab2111a2081ef31620fdb7342f602e9"
    class: GLiNERModel
    output_file: gliner_biomed_ner.csv
    threshold: 0.5
    chunk_size: 2000
    entity_types: "*"
    note: "Biomedical GLiNER variant; NOT in the default production ensemble"
  - registry_key: pubmedbert
    model_id: "alvaroalon2/biobert_diseases_ner"
    hf_revision: "0a4ed7dd4fd3e6db7229e5b801b70eefcb253759"
    class: PubMedBERTModel
    output_file: pubmedbert_ner.csv
    note: "BioBERT fine-tuned for disease NER"
  - registry_key: biolord
    model_id: "FremyCompany/BioLORD-2023"
    hf_revision: "167aab527b238a50ca65224e6319215d2ff4fc9f"
    class: sentence-transformers
    role: embedding_normalization
    note: "Biomedical sentence embeddings for Tier 4 semantic entity matching"
    used_in_build: true
    source_file: "cdm_pipeline/triples/biolord_matcher.py"

# ── API models (PubTator3) ────────────────────────────────────────────────────
api_models:
  - registry_key: pubtator
    class: PubTatorModel
    output_file: pubtator3_ner.csv
    esearch_url: "https://eutils.ncbi.nlm.nih.gov/entrez/eutils/esearch.fcgi"
    pubtator_url: "https://www.ncbi.nlm.nih.gov/research/pubtator3-api/publications/export/biocjson"
    rate_limit_sleep: 0.12    # seconds between papers
    esearch_timeout: 15       # seconds
    pubtator_timeout: 30      # seconds
    api_key_env: ENTREZ_API_KEY
    note: "NCBI PubTator3 API; requires PMID resolution via title search"

# ── Ollama (LLM inference server) ─────────────────────────────────────────────
# Module: ollama-bin/0.32.9 (EasyBuild). Requires rocm/6.3.3 on gpu-amd nodes.
# Start: ollama serve (background, port 11434 or SLURM_JOB_ID-offset port)
# Models pulled from ollama registry; pinned by digest (SHA-256 of manifest).
ollama:
  version: "ollama-bin/0.32.9"
  rocm_module: "rocm/6.3.3"
  # Determinism policy (process fix b):
  # All Ollama calls use temperature=0 and seed=42 for reproducibility.
  # Configured in pipelines/llm_terms/config/cdm_config.py MODEL_CONFIGS and passed
  # via pipelines/llm_terms/core/llm_client.py _call_ollama() options dict.
  # All hardcoded temperature values in cdm_pipeline/ and pipelines/llm_terms/ have
  # been updated to 0 with seed=42 in their Ollama options payloads.
  determinism:
    temperature: 0
    seed: 42
    top_p: 0.9
  models:
    - name: "qwen3.5:9b"
      digest: "6488c96fa5faab64bb65cbd30d4289e20e6130ef535a93ef9a49f42eda893ea7"
      role: "NER (LLM) + relation extraction + entity cleanup"
      architecture: qwen35
      parameters: 9.7B
      quantization: Q4_K_M
      context_length: 262144
      used_in_build: true
    - name: "nomic-embed-text:latest"
      digest: "0a109f422b47e3a30ba2b10eca18548e944e8a23073ee3f3e947efcf3c45e59f"
      role: "embedding (entity embeddings for dedup)"
      architecture: nomic-bert
      parameters: 136.73M
      quantization: F16
      context_length: 2048
      used_in_build: true
    - name: "bge-m3:latest"
      digest: "7907646426070047a77226ac3e684fbbe8410524f7b4a74d02837e43f2146bab"
      role: "embedding (ECO evidence mapping, semantic dedup, noise detection)"
      architecture: bert
      parameters: 566.70M
      quantization: F16
      context_length: 8192
      used_in_build: true

