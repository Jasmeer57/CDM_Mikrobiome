# ── NER model registry reference ──────────────────────────────────────────────
# registry.py is the runtime source of truth for NER model configs (class,
# kwargs, output_file). canonical.yaml is the canonical *pinning* manifest —
# it tracks SHA-256 hashes, HF revision hashes, and Ollama digests that
# registry.py does not. A verification script (src/scripts/verify_config.py)
# checks that the two stay in sync. See PUBLICATION_LOG.md Phase 1 item 6.

# ── Runner CLI defaults ───────────────────────────────────────────────────────
runner:
  command: "python -m cdm_pipeline.ner.runner"
  default_max_files: 500
  default_threshold: 0.5    # GLiNER only
  incremental: false
  entity_types: "*"         # all 14 CDM_TYPES from cdm_pipeline/config.py

# ── Corpus ────────────────────────────────────────────────────────────────────
corpus:
  input_dir: "data/papers_txt/"
  file_pattern: "*.txt"
  file_naming: "PRJ-accession-named .txt files (BioProject accessions)"
  paper_count: 444
  source: "NCBI BioProject metadata (bioproject_data_export.json)"
  reference: >
    Abdill, R. J., Graham, S. P., Rubinetti, V., et al. (2025).
    Integration of 168,000 samples reveals global patterns of the human gut microbiome.
    Cell 188(4):1100-1118.e17. DOI: 10.1016/j.cell.2024.12.017.

