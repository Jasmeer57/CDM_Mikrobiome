    transformers: "4.44.2"
    sentence-transformers: "2.2.2"
    scikit-learn: "1.6.1"
    pandas: "2.0.3"
    scipy: "1.10.1"
    gliner: "0.2.26"
    rapidfuzz: "3.4.0"
    rdflib: "7.6.0"
    biopython: "1.85"
    networkx: "3.2.1"
    faiss-cpu: "1.7.4"
    huggingface-hub: "0.25.2"
    tokenizers: "0.19.1"
    onnxruntime: "1.19.2"
