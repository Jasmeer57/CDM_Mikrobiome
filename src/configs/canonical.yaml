# ──────────────────────────────────────────────────────────────────────────────
# Microbiome-CDM canonical configuration
#
# Single source of truth for NER model selection, pinned versions, and
# entity/relation vocabularies. Every manifest, manuscript table, and
# release README MUST cite this file.
#
# To reproduce the v2.1.1-clean release:
#   1. conda activate microbiome-cdm-env  (or pip install -r requirements.lock)
#   2. python spacy_terms/scripts/install_scispacy_models.py --verify
#   3. python -m cdm_pipeline.ner.runner --models all --max_files 500
#   4. Follow cdm_pipeline/README.md for ontology mapping + CDM build
#
# Generated for Phase 1 of the Publication Readiness Plan (2026-10-03).
# ──────────────────────────────────────────────────────────────────────────────

version: "2.1.1"
schema_version: "2.0"
generated: "2026-10-03"

# ── CDM entity types (14) ─────────────────────────────────────────────────────
cdm_entity_types:
  - ORGANISM
  - CHEMICAL
  - DISEASE
  - PROTEIN
  - DNA_RNA
  - CELL_TYPE
  - GENOMICS
  - PATHWAY
  - LAB_METHOD
  - DATA_ANALYSIS
  - SAMPLE_METHOD
  - CLINICAL
  - EXPERIMENTAL_METHOD
  - STUDY_DESIGN

# ── Pinned Python environment ──────────────────────────────────────────────────
