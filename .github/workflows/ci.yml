name: CI

on:
  push:
    branches: [main, feat/publish-corpus-and-ontology]
  pull_request:
    branches: [main]

jobs:
  lint-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install lint tools
        run: pip install ruff black isort

      - name: Ruff check
        run: ruff check cdm_pipeline/ src/common/ --exclude "*/llama.cpp/*" --exit-zero

      - name: Black format check
        run: black --check cdm_pipeline/ src/common/ --exclude "llama.cpp" || true

      - name: Import smoke test (no heavy deps)
        run: |
          python -c "import common; print('common OK:', common.CDM_TYPES)"
          python -c "from cdm_pipeline.config import CDM_TYPES, VOCAB_PRIORITY; print('config OK:', len(CDM_TYPES), 'types,', len(VOCAB_PRIORITY), 'vocab priority lists')"
          python -c "from cdm_pipeline.mapping.confidence import _confidence, resolve_canonical; print('confidence module OK')"

      - name: SSSOM export smoke test (no DB needed)
        run: |
          python -c "from cdm_pipeline.export.sssom import export_sssom; print('SSSOM module OK')"
          python -c "from cdm_pipeline.export.biocypher import export_biocypher; print('BioCypher module OK')"
          python -c "from cdm_pipeline.export.conformal import calibrate_mappings; print('Conformal module OK')"
          python -c "from cdm_pipeline.export.doc_stats import generate_stats; print('Doc stats module OK')"
